<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" role="img" aria-labelledby="title desc">
  <title id="title">Remote update workflow</title>
  <desc id="desc">Build static web resources, upload a versioned bundle, and deploy an update document. The client checks the document, downloads the bundle, and installs it.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#71717a"/></marker></defs>
  <style>text{font:14px system-ui,sans-serif;fill:#18181b}rect{fill:#f4f4f5;stroke:#d4d4d8}.label{font-size:12px;fill:#52525b}.arrow{fill:none;stroke:#71717a;stroke-width:1.5;marker-end:url(#arrow)}@media(prefers-color-scheme:dark){text{fill:#fafafa}rect{fill:#27272a;stroke:#52525b}.label{fill:#a1a1aa}}</style>
  <rect x="20" y="25" width="220" height="58" rx="8"/><text x="130" y="50" text-anchor="middle">Build</text><text x="130" y="69" text-anchor="middle" class="label">Web Resources</text>
  <rect x="290" y="25" width="220" height="58" rx="8"/><text x="400" y="50" text-anchor="middle">Upload</text><text x="400" y="69" text-anchor="middle" class="label">Pack .wvb file</text>
  <rect x="560" y="25" width="220" height="58" rx="8"/><text x="670" y="50" text-anchor="middle">Deploy</text><text x="670" y="69" text-anchor="middle" class="label">Sign updates</text>
  <path class="arrow" d="M240 54 H285"/><path class="arrow" d="M510 54 H555"/>
  <path class="arrow" d="M670 83 V107 H130 V127"/>
  <rect x="20" y="132" width="220" height="58" rx="8"/><text x="130" y="157" text-anchor="middle">Check</text><text x="130" y="176" text-anchor="middle" class="label">Get updates</text>
  <rect x="290" y="132" width="220" height="58" rx="8"/><text x="400" y="157" text-anchor="middle">Download</text><text x="400" y="176" text-anchor="middle" class="label">Verify downloaded and stage</text>
  <rect x="560" y="132" width="220" height="58" rx="8"/><text x="670" y="157" text-anchor="middle">Install</text><text x="670" y="176" text-anchor="middle" class="label">Activate and reload</text>
  <path class="arrow" d="M240 161 H285"/><path class="arrow" d="M510 161 H555"/>
</svg>
